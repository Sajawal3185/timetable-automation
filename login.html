<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="card">
    <h2>NUML Archive</h2>
    <p>National University of Modern Languages</p>

    <form onsubmit="login(event)">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@numl.edu.pk" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <a href="forgot-password.html" class="forgot">Forgot password?</a>

      <button type="submit">Log in</button>
    </form>

    <div class="signup">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <script>
    function login(event) {
      event.preventDefault();
  
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
