name: backend-php-tests
on:
  pull_request:
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
permissions:
  contents: read
# A new push to the same PR cancels the run still going for the old one.
# Runs on main are never cancelled, so back-to-back merges each get checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd, intl, bcmath
          coverage: none
      # Ask Composer where its cache is (~/.composer/cache/files doesn't exist on these runners).
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend-php/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Tests use SQLite in memory (phpunit.xml); they only need an app key.
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      # Packages with known security problems (that's why we're on Laravel 13).
      # Never fails the PR (a new advisory isn't the PR's fault), but shows a yellow
      # warning on the run's summary page instead of hiding in a green step's log.
      - name: composer audit (warning only)
        run: composer audit || echo "::warning title=composer audit::Some packages have security advisories. Open this step's log and update them."
