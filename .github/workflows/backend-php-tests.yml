name: backend-php-tests
on:
  pull_request:
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
permissions:
  contents: read
# A new push to the same PR cancels the run still going for the old one.
# Runs on main are never cancelled, so back-to-back merges each get checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # SQLite on 8.3 (what we develop on) and 8.4 (DbTls uses 8.4's Pdo\Mysql names
    # there), plus MySQL 8, the database Aiven runs: the CHECK constraints and
    # MySQL's own behaviour are only tested in that one.
    name: test (php ${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.3", db: sqlite }
          - { php: "8.4", db: sqlite }
          - { php: "8.3", db: mysql }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Started for every entry (services can't depend on the matrix); only the
      # mysql entry points the tests at it.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timetable_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, zip, gd, intl, bcmath
          coverage: none
      # Real environment variables beat phpunit.xml's <env> defaults (SQLite in memory).
      - name: Use MySQL
        if: matrix.db == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=timetable_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> "$GITHUB_ENV"
      # Ask Composer where its cache is (~/.composer/cache/files doesn't exist on these runners).
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend-php/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Tests use SQLite in memory (phpunit.xml) unless the step above chose MySQL;
      # either way they only need an app key.
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      # Packages with known security problems (that's why we're on Laravel 13).
      # Never fails the PR (a new advisory isn't the PR's fault), but shows a yellow
      # warning on the run's summary page instead of hiding in a green step's log.
      - name: composer audit (warning only)
        if: matrix.php == '8.3' && matrix.db == 'sqlite'
        run: composer audit || echo "::warning title=composer audit::Some packages have security advisories. Open this step's log and update them."
