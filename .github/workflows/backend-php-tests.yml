name: backend-php-tests
on:
  pull_request:
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend-php/**"
      - ".github/workflows/backend-php-tests.yml"
permissions:
  contents: read
# A new push to the same PR cancels the run still going for the old one.
# Runs on main are never cancelled, so back-to-back merges each get checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # SQLite on 8.3 (what we develop on) and 8.4 (DbTls uses 8.4's Pdo\Mysql names
    # there), plus MySQL 8, the database Aiven runs: the CHECK constraints and
    # MySQL's own behaviour are only tested in that one.
    name: test (php ${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.3", db: sqlite }
          - { php: "8.4", db: sqlite }
          - { php: "8.3", db: mysql }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Started for every entry (services can't depend on the matrix); only the
      # mysql entry points the tests at it.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timetable_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, zip, gd, intl, bcmath
          coverage: none
      # Real environment variables beat phpunit.xml's <env> defaults (SQLite in memory).
      - name: Use MySQL
        if: matrix.db == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=timetable_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> "$GITHUB_ENV"
      # Ask Composer where its cache is (~/.composer/cache/files doesn't exist on these runners).
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend-php/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Tests use SQLite in memory (phpunit.xml) unless the step above chose MySQL;
      # either way they only need an app key.
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      # Packages with known security problems (that's why we're on Laravel 13).
      # Never fails the PR (a new advisory isn't the PR's fault), but shows a yellow
      # warning on the run's summary page instead of hiding in a green step's log.
      - name: composer audit (warning only)
        if: matrix.php == '8.3' && matrix.db == 'sqlite'
        run: composer audit || echo "::warning title=composer audit::Some packages have security advisories. Open this step's log and update them."

  # Builds the same image Render builds and calls it through Apache, so a broken
  # Dockerfile or start script shows up in the PR, not on deploy day.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t timetable-php backend-php
      - name: Start the container (SQLite instead of Aiven)
        run: |
          docker run -d --name api -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/database/ci.sqlite \
            timetable-php
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
      - name: Call it like the frontend does
        run: |
          set -x
          curl -fsS localhost:8080/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/no-such-thing)" = 404
          curl -fsS localhost:8080/docs > /dev/null
          # A real login + /me: proves the Authorization header reaches PHP through Apache.
          docker exec api php artisan tinker --execute="App\Models\User::create(['name'=>'CI','identifier'=>'ci-admin','role'=>'admin','password_hash'=>App\Services\Security::hashPassword('ci-password-1')]);"
          TOKEN=$(curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"identifier":"ci-admin","password":"ci-password-1"}' | jq -r .token)
          curl -fsS localhost:8080/api/auth/me -H "Authorization: Bearer $TOKEN" | grep -q '"identifier":"ci-admin"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/auth/me)" = 401
      - name: A trailing slash keeps a POST a POST (307, like FastAPI)
        run: |
          set -x
          # The redirect: 307 to the same path without the slash.
          REDIRECT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -X POST localhost:8080/api/auth/login/)
          test "$REDIRECT" = "307 http://localhost:8080/api/auth/login"
          # Behind Render's https proxy the Location must stay https.
          HTTPS_REDIRECT=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'X-Forwarded-Proto: https' -X POST localhost:8080/api/auth/login/)
          test "$HTTPS_REDIRECT" = "https://localhost:8080/api/auth/login"
          # Followed for real: curl -d (without -X) re-sends the POST body only for
          # 307/308. After a 301 it would send a GET, and login would answer 405.
          BODY='{"identifier":"ci-admin","password":"ci-password-1"}'
          curl -fsSL localhost:8080/api/auth/login/ -H 'Content-Type: application/json' -d "$BODY" | jq -e .token
      - name: Container log
        if: always()
        run: docker logs api
