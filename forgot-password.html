<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Forgot Password</title>
  <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

  <div class="card">
    <h2>Forgot password?</h2>
    <p>Enter your email and we will send you a link to reset your password.</p>

    <form onsubmit="sendLink(event)">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@numl.edu.pk" required>

      <button type="submit">Send reset link</button>
    </form>

    <!-- Link bhejne ke baad yeh message dikhega -->
    <div class="success" id="success">
      Reset link has been sent. Please check your email.
    </div>

   <a href="login.html" class="back-btn">← Back to login</a>
  </div>

  <script>
    function sendLink(event) {
      event.preventDefault();
      // Backend wale yahan API call lagayenge
      document.getElementById("success").style.display = "block";
    }
  </script>

</body>
</html>
