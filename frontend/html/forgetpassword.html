<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Forgot Password</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <div class="card">
    <h2>Forgot password?</h2>
    <p>Enter your email and we will send you a link to reset your password.</p>

    <form onsubmit="forgotPassword(event)">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@numls.edu.pk" required>
      <button>Send reset link</button>
    </form>

    <p class="msg" id="msg"></p>

    <a href="login.html" class="back-btn">← Back to login</a>
  </div>

  <script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
