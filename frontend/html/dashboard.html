<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | NUML Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="dash-page">

  <div class="shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">N</span>
        <strong>NUML Archive</strong>
      </div>

      <!-- Profile (click to see Logout) -->
      <div class="profile-wrap">
        <button class="profile" id="profileBtn" aria-expanded="false">
          <span class="avatar" id="userAvatar"></span>
          <span class="profile-text">
            <strong id="userName"></strong>
            <small id="userId"></small>
          </span>
          <span class="chev">&#9662;</span>
        </button>

        <div class="profile-menu" id="profileMenu" hidden>
          <a href="login.html" class="dash-logout">Log out</a>
        </div>
      </div>

      <p class="menu-title">MAIN MENU</p>

      <nav class="menu">
        <a href="unilecs.html">
          <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M7 10v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/></svg>
          Uni Lecs
        </a>
        <a href="pastpapers.html">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
          Past Papers
        </a>
        <a href="tools-resources.html">
          <svg viewBox="0 0 24 24"><path d="M4 5h6a3 3 0 013 3v12a2 2 0 00-2-2H4z"/><path d="M20 5h-6a3 3 0 00-3 3v12a2 2 0 012-2h7z"/></svg>
          Resources
        </a>
        <a href="gpacal.html">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>
          GPA Calculator
        </a>
        <a href="login.html" class="dash-logout">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          Log out
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="center">
        <span class="eyebrow" id="greeting">HEY</span>
        <h1>What do you want<br>to explore today?</h1>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
