<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | NUML Timetable Automation</title>
  <link rel="stylesheet" href="../../css/master.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/tt-auth.css">
</head>
<body class="auth-page tt-auth">

  <div class="card">
    <h2>Forgot password?</h2>
    <p>We'll send a code to the email you signed up with.</p>

    <!-- Step 1: who is it -->
    <form id="fpIdStep" novalidate>
      <label for="fpId">NUML email or ID</label>
      <input type="text" id="fpId" autocomplete="username" placeholder="name@numls.edu.pk or staff ID" required>
      <button type="submit" id="fpIdBtn">Send code</button>
      <p class="msg" id="fpIdMsg" role="alert"></p>
    </form>

    <!-- Step 2: code + new password -->
    <form id="fpResetStep" novalidate hidden>
      <p class="sent-to">If <strong id="fpIdShown"></strong> has an account, we sent a 6-digit code to its email. It works for 10 minutes.</p>

      <label for="fpCode">Code</label>
      <input type="text" id="fpCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>

      <label for="fpPassword">New password</label>
      <input type="password" id="fpPassword" autocomplete="new-password" placeholder="8 to 72 characters" required>

      <label for="fpPassword2">Confirm new password</label>
      <input type="password" id="fpPassword2" autocomplete="new-password" required>

      <button type="submit" id="fpResetBtn">Change password</button>
      <p class="msg" id="fpResetMsg" role="alert"></p>

      <div class="row-actions">
        <button type="button" class="text-btn" id="fpBack">← Different email or ID</button>
        <button type="button" class="text-btn" id="fpResend">Resend code</button>
      </div>
    </form>

    <!-- Done -->
    <div class="done" id="fpDone" hidden>
      <h3>Password changed</h3>
      <p>You can log in with your new password now.</p>
      <a href="timetable-login.html" class="button-link">Log in</a>
    </div>

    <p class="demo-note" id="fpDemo" hidden></p>

    <div class="auth-links" id="fpLinks">
      <a href="timetable-login.html">← Back to login</a>
      <a href="signup.html">Create account</a>
    </div>
  </div>

  <script src="../../js/timetable/tt-config.js"></script>
  <script src="../../js/timetable/tt-mock.js"></script>
  <script src="../../js/timetable/tt-api.js"></script>
  <script src="../../js/timetable/tt-forgot.js"></script>
</body>
</html>
