<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | NUML Archive</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/archive-auth.css">
</head>
<body class="auth-page">
  <div class="card">
    <h2>NUML Archive</h2>
    <p>National University of Modern Languages</p>

    <form id="loginForm" novalidate>
      <label for="identifier" id="idLabel">Email Address</label>
      <input type="text" id="identifier" placeholder="Enter your registered email address" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
        <button type="button" id="togglePw" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <div class="auth-links">
        <a href="archive-forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn">Log in</button>
      <p class="msg error" id="msg" role="alert"></p>
    </form>

    <p class="signup" id="signupLine">New student? <a href="signup_student.html">Create account</a></p>
    <a href="index.html" class="back-btn">← Back to NUML Archive</a>

    <p class="demo-note" id="loginDemo" hidden></p>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/archive-login.js"></script>
</body>
</html>
