<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign Up | NUML Archive</title>

  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <div class="card">
    <h2>Create Account</h2>
    <p>Join NUML Archive to access your academic resources</p>

  <form id="signupForm" novalidate onsubmit="return false;">

      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName"
             placeholder="Enter your first name" autocomplete="given-name">

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName"
             placeholder="Enter your last name" autocomplete="family-name">

      <label for="email">Email Address</label>
      <input type="text" id="email" name="email"
             placeholder="Enter your email address"
             autocomplete="email" inputmode="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter at least 8 characters">

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword"
             placeholder="Re-enter your password">

      <button type="submit">Create Account</button>

      <p class="msg" id="signupMessage" role="status"></p>
    </form>

    <p class="signup">
      Already have an account?
      <a href="login_student.html">Log in</a>
    </p>

    <a href="index.html" class="back-btn">Back to Home</a>
  </div>

<script src="../js/signup_student.js" defer></script>

</body>
</html>
