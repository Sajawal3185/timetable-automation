<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | NUML Archive</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <div class="card">
    <h2>Forgot password?</h2>
<p>Enter your registered email address and we'll send a verification code.</p>
    <form id="forgotPasswordForm" novalidate>
<label for="email">Email Address</label>
      <input type="text" id="email" placeholder="Enter your registered email address" autocomplete="username" required>
      <button type="submit" id="sendBtn">Send code</button>
      <p class="msg" id="resetMessage" role="status"></p>
    </form>

    <div class="auth-links split">
      <a href="archive-login.html">← Back to login</a>
      <a href="signup_student.html">Create account</a>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/archive-forgot-password.js"></script>
</body>
</html>
