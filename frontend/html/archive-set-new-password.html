<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password | NUML Archive</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/tt-auth.css">
  <link rel="stylesheet" href="../css/archive-auth.css">
</head>
<body class="auth-page tt-auth archive-flow">
  <div class="card">
    <h2>Set new password</h2>
    <p>Choose a new password for your account.</p>

    <form id="newPasswordForm" novalidate>
      <p class="sent-to">Resetting the password for <strong id="npEmail"></strong></p>

      <label for="npPassword">New password</label>
      <input type="password" id="npPassword" autocomplete="new-password" placeholder="8 to 72 characters" required>

      <label for="npPassword2">Confirm password</label>
      <input type="password" id="npPassword2" autocomplete="new-password" placeholder="Re-enter your new password" required>

      <button type="submit" id="npBtn">Change password</button>
      <p class="msg" id="npMsg" role="alert"></p>
    </form>

    <!-- Done: success message, then login -->
    <div class="done" id="npDone" hidden>
      <h3>Password changed</h3>
      <p>Your password was reset successfully. Taking you to the login page…</p>
      <a href="archive-login.html" class="button-link">Log in now</a>
    </div>

    <p class="demo-note" id="npDemo" hidden></p>

    <div class="auth-links" id="npLinks">
      <a href="archive-login.html">← Back to login</a>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/archive-set-new-password.js"></script>
</body>
</html>
