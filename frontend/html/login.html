<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Login</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <div class="card">
    <h2>NUML Archive</h2>
    <p>National University of Modern Languages</p>

   <form onsubmit="login(event)">
  <label>Email</label>
  <input type="email" id="email" placeholder="you@numls.edu.pk" required>

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password" required>


  <button>Log in</button>
</form>
 <a href="forgetpassword.html" class="forgot">Forgot password?</a>
    <div class="signup">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
