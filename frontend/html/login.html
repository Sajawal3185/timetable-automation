
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Login</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <div class="card">
    <h2>NUML Archive</h2>
    <p>National University of Modern Languages</p>

    <form id="loginForm" onsubmit="login(event)">
      <label for="email">University Email</label>
      <input type="email" id="email"
        placeholder="numl-f24-12345@numls.edu.pk" required>

      <label for="password">Password</label>
      <input type="password" id="password"
        placeholder="Enter password" required>

      <button type="submit">Log in</button>
      <p class="msg" id="msg"></p>
    </form>

    <a href="forgetpassword.html" class="forgot">Forgot password?</a>

    <div class="signup">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

<script src="../js/common.js"></script>
<script src="../js/auth.js"></script></body>
</html>
