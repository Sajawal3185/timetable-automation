<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUML Archive - Login</title>
  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <div class="card">
    <h2>NUML Archive</h2>
    <p>National University of Modern Languages</p>

    <form id="loginForm">
      <label for="identifier">Roll number</label>
      <input type="text" id="identifier"
        placeholder="Enter your roll number" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password"
        placeholder="Enter password" autocomplete="current-password" required>

      <button type="submit">Log in</button>
      <p class="msg" id="msg"></p>
    </form>

    <a href="forgot-password.html" class="forgot">Forgot password?</a>

    <div class="signup">
      Accounts are created by your department admin.
    </div>
  </div>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
