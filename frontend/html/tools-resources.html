<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software and Tools | NUML Archive</title>

  <link rel="stylesheet" href="../css/master.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="res-page">

  <!-- Banner (same as lecture page) -->
  <header class="page-head">
    <a href="dashboard.html" class="back-link">← Back to dashboard</a>
    <h1>Software and Tools</h1>
    <p>Find useful software for your courses and learn how to install it.</p>
  </header>

  <main>
    <section class="filter-box">
      <h2>Find your tools</h2>

      <div class="filters">
        <input
          id="search"
          type="search"
          placeholder="Search tools..."
          aria-label="Search tools"
        >

        <select id="course" aria-label="Filter by course"></select>

        <select id="category" aria-label="Filter by category"></select>

        <select id="os" aria-label="Filter by operating system"></select>
      </div>
    </section>

    <div class="results-header">
      <h2>Available Tools</h2>
      <p id="count" aria-live="polite"></p>
    </div>

    <div id="list" class="grid"></div>
  </main>

  <!-- Footer (master style) -->
  <footer class="footer">
    <b>NUML Archive</b>
    <span>Student Learning Resources</span>
  </footer>

  <script src="../js/common.js"></script>
  <script src="../js/resources.js"></script>
</body>
</html>
