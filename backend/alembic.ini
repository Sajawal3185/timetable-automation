# Alembic configuration. Run every alembic command from the backend/ folder.
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL from app settings (.env).

[alembic]
script_location = alembic
prepend_sys_path = .
# 2026_11_10_<rev>_<slug>.py sorts by date in the folder listing
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
